<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515">
<title>MC方块弹射 · MC Block Launch</title><link rel="stylesheet" href="style.css"></head><body>
<main class="viewport" id="gameRoot">
 <canvas id="stage" width="1536" height="864" aria-label="像素攻城二维物理游戏"></canvas>
 <div class="topbar"><select id="levelSelect" aria-label="选择关卡"></select><div class="tools">
 <button id="soundToggle" aria-label="切换音效" title="切换音效">♫</button><button id="restart" aria-label="↻ 重开" title="重开（R）">↻</button>
 <button id="pause" aria-label="Ⅱ 暂停" title="暂停（空格）">Ⅱ</button><button id="skip" aria-label="切换关卡 →" title="下一关（N）">→</button></div></div>
 <div id="loadState" role="status">正在加载原版纹理与物理引擎…</div>
 <div class="gamehint" id="gamehint">拖动弹弓上的弹药，向左下拉开，松手发射</div>
 <div class="inventory"><div class="ammo-count" id="ammo"></div><div id="ballbar" class="ballbar" aria-label="物品栏"></div></div>
 <div class="result hidden" id="result"><div class="result-inner"><span id="resultFlag">过关</span><h2 id="resultTitle">挑战成功</h2><p id="resultMsg"></p>
 <div class="result-buttons"><button id="retryBtn">重试</button><button id="nextBtn">下一关 →</button></div></div></div>
</main><script src="vendor/matter.min.js"></script>
<script>window.addEventListener('error',function(e){var p=document.querySelector('#loadState');if(p&&!p.hidden){p.classList.add('error');p.textContent='加载失败，请双击 START_GAME.bat 重新启动。'+(e.message||'必要脚本无法加载');}});</script>
<script type="module" src="game.js"></script></body></html>
