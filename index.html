<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515">
<title>MC方块弹射 · MC Block Launch</title><link rel="stylesheet" href="style.css"></head><body>
<main class="viewport" id="gameRoot">
 <canvas id="stage" width="1536" height="864" aria-label="像素攻城二维物理游戏"></canvas>
 <div id="loadState" role="status">正在加载原版纹理与物理引擎…</div>
 <div class="gamehint faded" id="gamehint"></div>
 <div class="inventory" id="inventory"><div id="ballbar" class="ballbar" aria-label="物品栏"></div></div>
 <section id="levelMenu" class="menu-screen hidden" aria-label="选关">
  <div class="campaign-panel"><h1>MC方块弹射</h1><p class="menu-subtitle">用有限的方块弹药，逐关清除敌对生物</p><div id="levelCards" class="level-grid"></div><p class="menu-help">拖动发射 · 右键取消 · 滚轮换物品 · ESC 菜单</p></div>
 </section>
 <section id="pauseMenu" class="menu-screen hidden" aria-label="暂停菜单"><div class="pause-panel"><h2>游戏暂停</h2>
  <button id="resume">继续游戏</button><button id="restart" aria-label="↻ 重开">重新挑战</button><button id="levelMenuBtn">选择关卡</button><button id="soundToggle">音效：开</button>
 </div></section>
 <section class="result hidden" id="result"><div class="result-inner"><span id="resultFlag">挑战成功</span><h2 id="resultTitle"></h2><img id="rewardIcon" class="reward-icon hidden" alt=""><p id="resultMsg"></p>
 <div class="result-buttons"><button id="retryBtn">重新挑战</button><button id="nextBtn">下一关</button><button id="resultLevels">选关</button></div></div></section>
</main><script src="vendor/matter.min.js"></script>
<script>window.addEventListener('error',function(e){var p=document.querySelector('#loadState');if(p&&!p.hidden){p.classList.add('error');p.textContent='加载失败，请双击 START_GAME.bat 重新启动。'+(e.message||'必要脚本无法加载');}});</script>
<script type="module" src="game.js"></script></body></html>
