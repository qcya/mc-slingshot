name: Game checks
on: [push, pull_request]
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-evidence
          path: |
            evidence/
            test-results/
